---
# yaml-language-server: $schema=https://raw.githubusercontent.com/mfontanini/presenterm/master/config-file-schema.json
defaults:
  terminal_font_size: 21
  image_protocol: iterm2

options:
  implicit_slide_ends: false
  command_prefix: ""
  incremental_lists: false
  strict_front_matter_parsing: true
  end_slide_shorthand: false

transition:
  duration_millis: 300
  frames: 45
  animation:
    style: fade

typst:
  ppi: 300

mermaid:
  scale: 2

snippet:
  exec:
    enable: true
  render:
    threads: 2

bindings:
  next: ["l", "j", "<right>", "<page_down>", "<down>", " "]
  next_fast: ["n"]
  previous: ["h", "k", "<left>", "<page_up>", "<up>"]
  previous_fast: ["p"]
  first_slide: ["gg"]
  last_slide: ["G"]
  go_to_slide: ["<number>G"]
  execute_code: ["<c-e>"]
  reload: ["<c-r>"]
  toggle_slide_index: ["<c-p>"]
  toggle_bindings: ["?"]
  close_modal: ["<esc>"]
  exit: ["<c-c>", "q"]
